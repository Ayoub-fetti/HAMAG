<html lang="fr">

    <title>HAMAG - Bon de Livraison</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- PDF text/vector based: NO html2canvas -->

<body class="bg-gray-100 p-4">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow">
        <h1 class="text-2xl font-bold text-center mb-6">
            Générateur de Bon de Livraison HAMAG
        </h1>

        <form id="deliveryForm" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">N° de Pièce</label>
                    <input
                        type="text"
                        id="pieceNumber"
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2"
                        placeholder="A12345678"
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Date</label>
                    <input
                        type="date"
                        id="deliveryDate"
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2"
                    >
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Destination</label>
                    <input
                        type="text"
                        id="destination"
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2"
                        placeholder="Casablanca"
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">N° D.U.M</label>
                    <input
                        type="text"
                        id="dumNumber"
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2"
                        placeholder="3010102025005656 L"
                    >
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Désignation</label>
                <textarea
                    id="designation"
                    class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2"
                    rows="3"
                    placeholder="Description de la désignation"
                ></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Client</label>
                <input
                    type="text"
                    id="jesa"
                    class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2"
                    placeholder="Votre client"
                >
            </div>

            <div class="flex justify-center">
                <button
                    type="button"
                    id="generatePDF"
                    class="bg-blue-800 text-white px-6 py-2 rounded-md hover:bg-blue-900 transition"
                >
                    Générer PDF
                </button>
            </div>
        </form>
    </div>

    function formatDate(dateValue) {
        if (!dateValue) return '';

        const [year, month, day] = dateValue.split('-');
        if (!year || !month || !day) return dateValue;

        return `${day}/${month}/${year}`;
    }

    function cleanText(value) {
        return String(value ?? '').trim();
    }

    // Prevent very long filenames / Windows-invalid filename characters.
    function sanitizeFileName(value) {
        let name = cleanText(value)
            .replace(/[<>:"/\\|?*\x00-\x1F]/g, '_')
            .replace(/\s+/g, ' ')
            .trim();

        if (!name) name = 'bon_livraison_HAMAG';
        if (!name.toLowerCase().endsWith('.pdf')) name += '.pdf';

        return name;
    }

    function splitTextForPdf(doc, text, maxWidth) {
        const value = cleanText(text);
        return value ? doc.splitTextToSize(value, maxWidth) : [''];
    }

    function drawClientBox(doc, clientName, xRight, yTop) {
        const text = cleanText(clientName) || 'CLIENT';

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(18);

        const paddingX = 6;
        const paddingY = 5;
        const textWidth = doc.getTextWidth(text);
        const boxWidth = Math.min(textWidth + (paddingX * 2), 65);
        const boxHeight = 18 + (paddingY * 2);

        // Flexible box width according to the client text.
        const boxX = xRight - boxWidth;

        doc.setDrawColor(0, 0, 0);
        doc.setLineWidth(0.4);
        doc.roundedRect(boxX, yTop, boxWidth, boxHeight, 2, 2, 'S');

        // Keep the text centered inside the flexible box.
        const innerWidth = boxWidth;
        const centerX = boxX + innerWidth / 2;
        const baselineY = yTop + boxHeight / 2 + 6;

        doc.text(text, centerX, baselineY, {
            align: 'center',
            maxWidth: innerWidth - 4
        });

        return { boxX, boxWidth, boxHeight };
    }

    document.getElementById('generatePDF').addEventListener('click', function () {
        const pieceNumber = cleanText(document.getElementById('pieceNumber').value);
        const deliveryDateValue = document.getElementById('deliveryDate').value;
        const destination = cleanText(document.getElementById('destination').value);
        const dumNumber = cleanText(document.getElementById('dumNumber').value);
        const designation = cleanText(document.getElementById('designation').value);
        const client = cleanText(document.getElementById('jesa').value);

        if (!designation) {
            alert('Veuillez saisir une Désignation.');
            return;
        }

        const pdf = new jsPDF({
            orientation: 'portrait',
            unit: 'mm',
            format: 'a4',
            compress: true,
            putOnlyUsedFonts: true
        });

        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();
        const marginX = 16;
        const contentWidth = pageWidth - (marginX * 2);
        let y = 14;

        // HAMAG blue used by the original HTML design (#1a4e7a)
        const hamagBlue = [26, 78, 122];
        const borderColor = [35, 35, 35];
        const textColor = [35, 35, 35];

        // ===== HEADER =====
        // ===== HEADER =====
        // Logo is intentionally larger, while keeping the same original proportions.
        const logoX = marginX;
        const logoY = y - 3;
        const logoWidth = 70;
        const logoHeight = 40;

        try {
            if (HAMAG_LOGO_BASE64) {
                pdf.addImage(
                    'data:image/png;base64,' + HAMAG_LOGO_BASE64,
                    'PNG',
                    logoX,
                    logoY,
                    logoWidth,
                    logoHeight
                );
            }
        } catch (error) {
            console.warn('Logo non chargé :', error);
        }

        // Title stays in the same font/color, but is placed below the logo.
        pdf.setFont('helvetica', 'bold');
        pdf.setFontSize(17.5);
        pdf.setTextColor(...hamagBlue);
        pdf.text('BON DE LIVRAISON', logoX, logoY + logoHeight + 10);

        // Client box: square corners + automatic width and height.
        const clientText = client || 'CLIENT';
        const clientFontSize = 16;
        pdf.setFont('helvetica', 'bold');
        pdf.setFontSize(clientFontSize);
        const clientPaddingX = 3;
        const clientPaddingY = 2.5;
        const maxClientWidth = 66;
        const clientBoxMinWidth = 30;

        // Keep the box flexible in width, then wrap the text when necessary.
        const singleLineWidth = pdf.getTextWidth(clientText);
        const clientBoxWidth = Math.min(
            maxClientWidth,
            Math.max(clientBoxMinWidth, singleLineWidth + (clientPaddingX * 2))
        );
        const clientTextLines = pdf.splitTextToSize(
            clientText,
            clientBoxWidth - (clientPaddingX * 2)
        );
        const lineHeight = clientFontSize * 0.42;
        const clientTextHeight = clientTextLines.length * lineHeight;
        const clientBoxHeight = Math.max(17, clientTextHeight + (clientPaddingY * 2));
        const clientBoxX = pageWidth - marginX - clientBoxWidth;
        const clientBoxY = y + 2;

        pdf.setDrawColor(0, 0, 0);
        pdf.setLineWidth(0.35);
        pdf.rect(clientBoxX, clientBoxY, clientBoxWidth, clientBoxHeight, 'S');

        pdf.setTextColor(...textColor);
        const clientStartY = clientBoxY + ((clientBoxHeight - clientTextHeight) / 2) + (lineHeight * 0.78);
        pdf.text(clientTextLines, clientBoxX + (clientBoxWidth / 2), clientStartY, {
            align: 'center',
            maxWidth: clientBoxWidth - (clientPaddingX * 2)
        });

        // Table starts after the complete header so it never overlaps the client box.
        const titleBottomY = logoY + logoHeight + 6.5;
        y = Math.max(clientBoxY + clientBoxHeight, titleBottomY) + 15;

        // ===== TABLE 1 =====
        pdf.autoTable({
            startY: y,
            margin: { left: marginX, right: marginX },
            tableWidth: contentWidth,
            theme: 'grid',
            head: [[
                'Référence',
                'DATE',
                'DESTINATION',
                'N° D.U.M'
            ]],
            body: [[
                pieceNumber,
                formatDate(deliveryDateValue),
                destination,
                dumNumber
            ]],
            styles: {
                font: 'helvetica',
                fontSize: 8.7,
                textColor,
                lineColor: borderColor,
                lineWidth: 0.22,
                cellPadding: 2,
                fontStyle: 'bold',
                minCellHeight: 8.5,
                valign: 'middle'
            },
            headStyles: {
                fillColor: [30, 64, 175],
                textColor: [255, 255, 255],
                fontStyle: 'bold',
                fontSize: 8,
                halign: 'center',
                valign: 'middle',
                cellPadding: { top: 1.4, right: 1.5, bottom: 1.4, left: 1.5 },
                minCellHeight: 6.2
            },
            bodyStyles: {
                halign: 'center',
                minCellHeight: 9
            },
            columnStyles: {
                0: { cellWidth: 35, halign: 'center' },
                1: { cellWidth: 30, halign: 'center' },
                2: { cellWidth: 49, halign: 'center' },
                3: { cellWidth: 64, halign: 'center' }
            },
            pageBreak: 'avoid'
        });

        // Balanced separation without making the page feel empty.
        y = pdf.lastAutoTable.finalY + 25;

        // ===== TABLE 2 =====
        const designationLines = splitTextForPdf(pdf, designation, contentWidth - 47 - 8);
        const designationHeight = Math.max(13, (designationLines.length * 4.6) + 7);

        pdf.autoTable({
            startY: y,
            margin: { left: marginX, right: marginX },
            tableWidth: contentWidth,
            theme: 'grid',
            head: [[
                'Référence',
                'Désignation'
            ]],
            body: [[
                pieceNumber,
                designationLines
            ]],
            styles: {
                font: 'helvetica',
                fontSize: 8.7,
                textColor,
                lineColor: borderColor,
                lineWidth: 0.22,
                cellPadding: 2.4,
                fontStyle: 'bold',
                minCellHeight: 8.5,
                valign: 'middle'
